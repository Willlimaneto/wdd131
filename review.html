<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Confirmation">
    <meta name="author" content="Anderson Lima">
    <title>Review Submitted</title>

    <link rel="stylesheet" href="styles/form.css">
</head>

<body>

    <header>
        <h1>Review Submitted</h1>
    </header>

    <main>
        <section class="confirmation">
            <h2>Thank You!</h2>

            <p>Your product review has been successfully submitted.</p>

            <p>
                Reviews completed:
                <strong id="review-count">0</strong>
            </p>
        </section>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> | Anderson Lima | Angola
        </p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>

    <script>
        
        let reviewCount = Number(localStorage.getItem("reviewCount")) || 0;

       
        reviewCount++;

        localStorage.setItem("reviewCount", reviewCount);

        document.querySelector("#review-count").textContent = reviewCount;

        document.querySelector("#currentyear").textContent =
            new Date().getFullYear();

        document.querySelector("#lastModified").textContent =
            document.lastModified;
    </script>

</body>
</html>
