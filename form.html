<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form - WDD 131 Dynamic Web Fundamentals">
    <meta name="author" content="Anderson Lima">
    <title>Product Review</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <div class="form-section">
                <label for="product">Product Name</label>

                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <div class="form-section">
                <fieldset>
                    <legend>Overall Rating</legend>

                    <div class="rating">
                        <label for="rating1">
                            <span>☆</span>
                            <input type="radio" id="rating1" name="rating" value="1" required>
                        </label>

                        <label for="rating2">
                            <span>☆☆</span>
                            <input type="radio" id="rating2" name="rating" value="2">
                        </label>

                        <label for="rating3">
                            <span>☆☆☆</span>
                            <input type="radio" id="rating3" name="rating" value="3">
                        </label>

                        <label for="rating4">
                            <span>☆☆☆☆</span>
                            <input type="radio" id="rating4" name="rating" value="4">
                        </label>

                        <label for="rating5">
                            <span>☆☆☆☆☆</span>
                            <input type="radio" id="rating5" name="rating" value="5">
                        </label>
                    </div>
                </fieldset>
            </div>

            <div class="form-section">
                <label for="install-date">Date of Installation</label>

                <input
                    type="date"
                    id="install-date"
                    name="install-date"
                    required
                >
            </div>

            <div class="form-section">
                <fieldset>
                    <legend>
                        Which features did you find useful?
                        <span class="instructions">(Check all that apply)</span>
                    </legend>

                    <label class="checkbox-label">
                        <input
                            type="checkbox"
                            id="durability"
                            name="features"
                            value="Durability"
                        >
                        Durability
                    </label>

                    <label class="checkbox-label">
                        <input
                            type="checkbox"
                            id="ease-of-use"
                            name="features"
                            value="Ease of Use"
                        >
                        Ease of Use
                    </label>

                    <label class="checkbox-label">
                        <input
                            type="checkbox"
                            id="performance"
                            name="features"
                            value="Performance"
                        >
                        Performance
                    </label>

                    <label class="checkbox-label">
                        <input
                            type="checkbox"
                            id="design"
                            name="features"
                            value="Design"
                        >
                        Design
                    </label>
                </fieldset>
            </div>

            <div class="form-section">
                <label for="review">
                    Written Review
                    <span class="optional">(Optional)</span>
                </label>

                <textarea
                    id="review"
                    name="review"
                    rows="6"
                ></textarea>
            </div>

            <div class="form-section">
                <label for="user-name">
                    Your Name
                    <span class="optional">(Optional)</span>
                </label>

                <input
                    type="text"
                    id="user-name"
                    name="user-name"
                >
            </div>

            <input type="submit" value="Post Review">

        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> | Anderson Lima | Angola
        </p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>

</body>
</html>
